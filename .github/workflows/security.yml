# <target-repo>/.github/workflows/security.yml
name: security
on:
  pull_request:
permissions:
  contents: read

jobs:
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@606611298d9d15d547ac70dd3b9e9554f1316c08
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@606611298d9d15d547ac70dd3b9e9554f1316c08
    permissions:
      contents: read
      pull-requests: read
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@606611298d9d15d547ac70dd3b9e9554f1316c08
    permissions:
      contents: read
      pull-requests: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@606611298d9d15d547ac70dd3b9e9554f1316c08
