# <target-repo>/.github/workflows/security.yml
name: security
on:
  pull_request:
permissions:
  contents: read

jobs:
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@7d92bb5cbd33ab3c4bc3f1bd3a0ed14c7007966d
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@7d92bb5cbd33ab3c4bc3f1bd3a0ed14c7007966d
    permissions:
      contents: read
      pull-requests: read
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@7d92bb5cbd33ab3c4bc3f1bd3a0ed14c7007966d
    permissions:
      contents: read
      pull-requests: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@7d92bb5cbd33ab3c4bc3f1bd3a0ed14c7007966d
